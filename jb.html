    for (var i = 0; i < keepAlive.length; i++) keepAlive[i] = null;
    keepIndex = 0;
    captureState = 0;
    hostAddress = NaN; fakeAddress = NaN; targetAddress = NaN;
    rwHeaderOK = false; targetHeaderOK = false;
    readObserved = false; writeObserved = false; restoreObserved = false;
    compositionState = 0;
    retrySafe = false;
}

function scheduleRetry(reason) {
    attemptSucceeded = false;
    if (attemptNumber >= MAX_ATTEMPTS) {
        mark("GIVE-UP", "all-" + MAX_ATTEMPTS + "-attempts-failed last=" + reason);
        mark("ADVICE", "power-cycle-the-ps4-fresh-boot-then-one-clean-load");
        return;
    }
    mark("RETRY", "reason=" + reason + "-next=" + (attemptNumber + 1) + "-of-" + MAX_ATTEMPTS);
    setTimeout(runAttempt, 1500);
}

function runAttempt() {
    attemptNumber++;
    if (attemptNumber > 1) cleanupForRetry();
    updateMeta();
    mark("ATTEMPT", attemptNumber + "-of-" + MAX_ATTEMPTS + "-n=" + DRAIN_COUNT);
    try {
        buildAndStoreGraph();
        prepareAddrof();
    } catch (error) {
        mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
        scheduleRetry("setup");
    }
}

// ========== INIT ==========
updateMeta();
renderStages();
mark("BOOT", "rev=" + REVISION + "-k=" + K + "-n=" + DRAIN_COUNT + "-c=" + CARRIER_SLOTS + "-r=" + MAX_ATTEMPTS);
try {
    runAttempt();
} catch (error) {
    mark("SETUP-THREW", (error && error.name) + ":" + String(error && error.message).slice(0, 80));
}
</script>
